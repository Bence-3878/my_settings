[global_config]
  suppress_multiple_term_dialog = True
  borderless = False
  title_hide_sizetext = True
  inactive_color_offset = 0.85

[keybindings]
  # Alt+nyilak felszabadítása a tmux panelek közötti váltáshoz
  go_up = ""
  go_down = ""
  go_left = ""
  go_right = ""

[profiles]
  [[default]]
    background_color = "#1e1e2e"
    background_darkness = 0.92
    background_type = transparent
    cursor_fg_color = "#1e1e2e"
    cursor_bg_color = "#f5e0dc"
    cursor_color_default = False
    font = JetBrainsMono Nerd Font Mono 11
    foreground_color = "#cdd6f4"
    show_titlebar = False
    scrollbar_position = disabled
    scrollback_lines = 10000
    palette = "#45475a:#f38ba8:#a6e3a1:#f9e2af:#89b4fa:#f5c2e7:#94e2d5:#bac2de:#585b70:#f38ba8:#a6e3a1:#f9e2af:#89b4fa:#f5c2e7:#94e2d5:#a6adc8"
    use_system_font = False
    audible_bell = False
    copy_on_selection = False

[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0

[plugins]
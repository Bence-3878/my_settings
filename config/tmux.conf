# --- Alapok és színek ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0                # Nincs késleltetés ESC-nél (Vim/Zsh)
set -g history-limit 10000           # Nagyobb görgetési előzmény
set -g mouse on                      # Egérrel kattintás, átméretezés, görgetés

# --- Számozás (1-től, automatikus újraszámozással) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Logikusabb ablakosztás (aktuális mappában nyílik) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Gyors váltás pane-ek között Alt + nyilakkal (Prefix nélkül) ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Konfig újratöltése: Prefix + r ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf újratöltve!"

# --- Letisztult státuszsor ---
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=cyan,bold] #S #[fg=brightblack]│ "
set -g status-right "#[fg=brightblack]│ #[fg=green]#H #[fg=brightblack]│ #[fg=yellow]%H:%M "
set -g status-left-length 30
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "